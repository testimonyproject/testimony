# PR #381: faith working through love, Aquinas to Bellarmine.
# The PR adds nine claims to the sola fide vocabulary (Galatians 5:6,
# Romans 11:6, James 2:17, formed faith, love as faith's fruit, Abraham as a
# believer in Romans 4, Bellarmine's works without grace and the two stated
# sameness conditions), so every valuation over it is larger to reduce.
# CI measured +8.5% and +7.3% on the two model checks, and +5.2% on the
# ontology check, which reads the new claims' meanings.
#
# The refutation of Bellarmine's reading from Paul's use of the verb adds a
# rule to a package's strength: a step to a claim rated refuted ranks refuted,
# so every package's strength now looks up the rating of each step's
# conclusion, in every defeat table and every check that reads strengths. CI
# measured the tables, rows and the AIF check 6% to 16% slower on runners
# whose calibration drifted up to 13% in the same run.

[[accept]]
benchmark = "satisfied_by: the Pauline case"
metric = "time"
up_to = 0.18
reason = "Nine new sola fide claims for the faith-and-charity chapter, including the two sameness conditions the conditions check requires Bellarmine's lines to state, so each valuation over the larger claim type costs more; CI measured +8.5%, then +12.1%"

