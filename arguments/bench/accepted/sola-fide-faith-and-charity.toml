# PR #381: faith working through love, Aquinas to Bellarmine.
# The PR adds nine claims to the sola fide vocabulary (Galatians 5:6,
# Romans 11:6, James 2:17, formed faith, love as faith's fruit, Abraham as a
# believer in Romans 4, Bellarmine's works without grace and the two stated
# sameness conditions), so every valuation over it is larger to reduce.
# CI measured +8.5% and +7.3% on the two model checks, and +5.2% on the
# ontology check, which reads the new claims' meanings.

[[accept]]
benchmark = "satisfied_by: the Pauline case"
metric = "time"
up_to = 0.15
reason = "Nine new sola fide claims for the faith-and-charity chapter, including the two sameness conditions the conditions check requires Bellarmine's lines to state, so each valuation over the larger claim type costs more; CI measured +8.5%"

[[accept]]
benchmark = "satisfied_by: Trent grants the subjective genitive"
metric = "time"
up_to = 0.15
reason = "Nine new sola fide claims for the faith-and-charity chapter, including the two sameness conditions the conditions check requires Bellarmine's lines to state, so each valuation over the larger claim type costs more; CI measured +7.3%"

[[accept]]
benchmark = "checks: ontology"
metric = "time"
up_to = 0.12
reason = "Eight new sola fide claims gain meanings the ontology check now reads (Galatians 5:6, Romans 11:6, formed faith, love as faith's fruit, works without grace, and the two sameness conditions on Romans 4:4 and John 6:29); CI measured +5.2%"
