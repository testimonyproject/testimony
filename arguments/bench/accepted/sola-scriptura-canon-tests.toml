[[accept]]
benchmark = "leaves_open: parity leaves the canon open"
metric = "time"
up_to = 0.40
reason = "The canon chapter adds eight claims to the sola scriptura argument (Moses' tests, the apostolic foundation, 2 Peter 3:15-16, Galatians 1:8, the end of prophecy, books read but not received, providence), and its dilemma on how the canon is known adds eight more, so every reading of the argument's claims is a larger table: 64 claims become 80. The benchmark's own premises are unchanged; the cost is the size of the claim type it reads over, measured at +17% with the first eight."

[[accept]]
benchmark = "checks: ontology"
metric = "time"
up_to = 0.15
reason = "The ontology check reads every claim of every argument under its definitions. The canon chapter and its dilemma add sixteen claims to the sola scriptura argument, each with a meaning the check takes apart, so the check does more work: measured at +7.3% in CI. Nothing in the check itself changed."
