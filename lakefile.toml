name = "testimony"
version = "0.1.0"
defaultTargets = ["Testimony"]
# Batteries ships the environment-linter driver; `lake lint` runs it.
lintDriver = "batteries/runLinter"

# Tier 1 of four (see docs/src/style-guide.md): feedback in the editor rather
# than in CI. A docstring here states what a premise asserts and who holds it,
# so an undocumented declaration is very nearly an uncited one.
[leanOptions]
linter.missingDocs = true

[[require]]
name = "Foundation"
git = "https://github.com/FormalizedFormalLogic/Foundation"
rev = "master"

[[lean_lib]]
name = "Testimony"

# The modules a package's generators are built from: the harvest, the site's
# pages, the status table, the bibliography. The root does not import them, so
# they are a library of their own, built and replayed with the library
# (`lake build TestimonyTools`, and `scripts/kernel-replay.sh`). Not a default
# target: the environment linters read the default targets' modules, and have
# always read the root's alone.
[[lean_lib]]
name = "TestimonyTools"
roots = [
  "Testimony.Tools.Docs", "Testimony.Tools.Pages", "Testimony.Tools.Site",
  "Testimony.Tools.Status", "Testimony.Tools.Bibliography",
]
