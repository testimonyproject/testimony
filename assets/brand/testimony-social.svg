<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16293f"/>
      <stop offset="55%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0a141f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c87a"/>
      <stop offset="100%" stop-color="#c9a24d"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- faint proof-tree scaffolding in the background -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="3" fill="none">
    <line x1="120" y1="120" x2="420" y2="120"/>
    <line x1="270" y1="120" x2="270" y2="190"/>
    <line x1="170" y1="190" x2="520" y2="190"/>
    <line x1="345" y1="190" x2="345" y2="260"/>
    <line x1="860" y1="420" x2="1180" y2="420"/>
    <line x1="1020" y1="420" x2="1020" y2="490"/>
    <line x1="900" y1="490" x2="1160" y2="490"/>
  </g>

  <!-- turnstile mark -->
  <g stroke="url(#gold)" stroke-width="16" stroke-linecap="round" fill="none">
    <line x1="150" y1="268" x2="150" y2="420"/>
    <line x1="150" y1="344" x2="282" y2="344"/>
  </g>
  <circle cx="150" cy="268" r="13" fill="#e8c87a"/>
  <circle cx="150" cy="420" r="13" fill="#e8c87a"/>

  <text x="330" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#f2f2f0" letter-spacing="2">Testimony</text>
  <text x="336" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#9fb3c8" letter-spacing="1">Machine-checkable models of biblical arguments</text>
  <text x="336" y="440" font-family="'SF Mono', Menlo, monospace" font-size="24" fill="#c9a24d">premises ⊢ conclusion — every assumption named</text>
</svg>
