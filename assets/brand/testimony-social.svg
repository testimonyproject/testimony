<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- Testimony — social banner / cover (1280×640, 2:1).
       Safe for GitHub social preview, Patreon cover, X header. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16293f"/>
      <stop offset="55%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0a141f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c87a"/>
      <stop offset="100%" stop-color="#c9a24d"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- faint proof-tree scaffolding -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="3" fill="none">
    <line x1="120" y1="110" x2="420" y2="110"/>
    <line x1="270" y1="110" x2="270" y2="176"/>
    <line x1="170" y1="176" x2="520" y2="176"/>
    <line x1="345" y1="176" x2="345" y2="240"/>
    <line x1="860" y1="430" x2="1180" y2="430"/>
    <line x1="1020" y1="430" x2="1020" y2="496"/>
    <line x1="900" y1="496" x2="1160" y2="496"/>
  </g>

  <!-- mark at W2 proportions, scaled to the banner -->
  <g transform="translate(96,180) scale(0.55)">
    <g stroke="url(#gold)" stroke-width="52" stroke-linecap="round" fill="none">
      <line x1="150" y1="104" x2="150" y2="408"/>
      <line x1="92" y1="256" x2="388" y2="256"/>
    </g>
    <circle cx="150" cy="104" r="38" fill="#e8c87a"/>
    <circle cx="150" cy="408" r="38" fill="#e8c87a"/>
    <g stroke="#f2f2f0" stroke-width="28" stroke-linecap="butt" fill="none">
      <line x1="150" y1="196" x2="150" y2="356"/>
      <line x1="92" y1="256" x2="212" y2="256"/>
    </g>
    <rect x="404" y="220" width="72" height="72" rx="6" fill="#f2f2f0"/>
  </g>

  <text x="420" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="100" fill="#f2f2f0" letter-spacing="2">Testimony</text>
  <text x="426" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#9fb3c8" letter-spacing="1">Machine-checkable models of biblical arguments</text>
  <text x="426" y="412" font-family="'SF Mono', Menlo, monospace" font-size="24" fill="#c9a24d">premises ⊢ conclusion — every assumption named</text>
</svg>
