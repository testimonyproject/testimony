[book]
title = "Testimony"
description = "Machine-checkable models of biblical arguments, with every premise sourced and contestable."
authors = ["The Testimony contributors"]
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/testimonyproject/testimony"
edit-url-template = "https://github.com/testimonyproject/testimony/edit/main/docs/{path}"
additional-css = ["theme/testimony.css"]
# Generated argument pages set their notation as LaTeX; MathJax typesets it.
mathjax-support = true

[output.html.print]
enable = true

[output.html.fold]
enable = true
level = 1
