name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    container: ghcr.io/testimonyproject/testimony/devcontainer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build book
        run: mdbook build docs

      # doc-gen4 API documentation is deliberately not built here. It arrives
      # transitively via Foundation, but `lake build Testimony:docs` generates
      # documentation for the entire Mathlib closure, which is far too slow for
      # CI. See docs/src/roadmap.md.

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book
      - id: deployment
        uses: actions/deploy-pages@v4
