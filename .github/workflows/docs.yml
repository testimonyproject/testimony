name: Docs

on:
  push:
    branches: [main]
    # What the site and the PDFs beside it are made from: the hand-written
    # pages and templates under docs/, and the Lean source the generated pages
    # and documents are written from (scripts/generate-docs.sh, in pdf.yml's
    # job), the arguments and the examples among it. Nothing else on main
    # changes what is deployed. This workflow is no pull request's check, so a filter here can
    # leave no required check waiting.
    paths:
      - docs/**
      - examples/**
      - Testimony/**
      - Testimony.lean
      - arguments/**
      - scripts/generate-docs.sh
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
      - .devcontainer/**
      - .github/workflows/docs.yml
      - .github/workflows/pdf.yml
      - .github/workflows/devcontainer-image.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # The `deploy` job's container: pulls a GHCR package. ci.yml has no
  # explicit permissions block and inherits a broader default that already
  # covers this; this workflow's explicit block (needed for Pages) does not,
  # so it must ask for package read access itself.
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devcontainer-image.yml

  # The print editions, put beside the site so that the argument pages' links
  # to them resolve (`../pdf/arguments.pdf`, and `../pdf/arguments/<slug>.pdf`
  # for each argument on its own).
  pdf:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/pdf.yml

  deploy:
    needs: [image, pdf]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # The pages the generators wrote, in pdf.yml's job: they are not
      # committed.
      - uses: actions/download-artifact@v4
        with:
          name: generated

      - name: Build book
        run: mdbook build docs

      - uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: docs/book/pdf

      # doc-gen4 API documentation is deliberately not built here. It arrives
      # transitively via Foundation, but `lake build Testimony:docs` generates
      # documentation for the entire Mathlib closure, which is far too slow for
      # CI. See docs/src/roadmap.md.

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book
      - id: deployment
        uses: actions/deploy-pages@v4
