name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # The `deploy` job's container: pulls a GHCR package. ci.yml has no
  # explicit permissions block and inherits a broader default that already
  # covers this; this workflow's explicit block (needed for Pages) does not,
  # so it must ask for package read access itself.
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devcontainer-image.yml

  deploy:
    needs: image
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Build book
        run: mdbook build docs

      # doc-gen4 API documentation is deliberately not built here. It arrives
      # transitively via Foundation, but `lake build Testimony:docs` generates
      # documentation for the entire Mathlib closure, which is far too slow for
      # CI. See docs/src/roadmap.md.

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book
      - id: deployment
        uses: actions/deploy-pages@v4
