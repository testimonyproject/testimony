name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # The image ci.yml and docs.yml run in, so that Claude has what a cloud
    # session has: elan and the pinned Lean, tectonic, mdbook and uv. Without
    # it the job has no `lake`, and can neither build, nor regenerate a page,
    # nor run a gate (#199).
    #
    # Named directly, not through devcontainer-image.yml as ci.yml does: a
    # reusable-workflow job would run on every comment, mentioning @claude or
    # not, because the `if:` above cannot gate it. This pulls the image main's
    # CI last published, which is the toolchain main builds with.
    container: ghcr.io/testimonyproject/testimony/devcontainer:latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
      packages: read # Pulls the devcontainer image from GHCR
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The .lake directories ci.yml saves on main, restored and never saved:
      # a cache written from a comment's run would be keyed like main's and
      # could shadow it. The key is ci.yml's, so the two must change together.
      - name: Restore .lake
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake
            arguments/.lake
            examples/.lake
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', '**/lake-manifest.json') }}
          restore-keys: |
            lake-packages-${{ runner.os }}-
            lake-${{ runner.os }}-

      # What CLAUDE.md asks before the first build. Quick after a restore;
      # without one, it is what keeps Mathlib from compiling from source.
      - name: Fetch Mathlib oleans
        run: lake exe cache get

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          #
          # The action runs no Bash command it is not given. These are the
          # commands of CLAUDE.md's "Commands, in order": the four gates, the
          # generators with their --check runs, and the two renderers.
          claude_args: >-
            --allowedTools
            "Bash(lake:*),Bash(cd arguments && lake:*),Bash(cd examples && lake:*),Bash(python3 scripts/testimony_lint.py:*),Bash(python3 scripts/test_testimony_lint.py:*),Bash(scripts/kernel-replay.sh:*),Bash(../scripts/kernel-replay.sh:*),Bash(mdbook build:*),Bash(tectonic:*),Bash(cd docs/latex && tectonic:*)"

