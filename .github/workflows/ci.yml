name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On demand, against any ref: the four gates without opening a pull request,
  # which is what asking whether a stale branch still stands requires. Nothing
  # is published and nothing is measured: the image is pushed only on a push to
  # main, and the benchmarks are an A/B against the base a pull request merges
  # into, which a bare ref does not have. The run is the checks alone.
  #
  # The trigger must be on the default branch to be dispatchable at all, and the
  # run uses the workflow file of the ref it is dispatched against — so a branch
  # cut before this landed cannot be dispatched until it takes main.
  workflow_dispatch:

jobs:
  # Which jobs this change needs, from the files it touches
  # (scripts/ci_changes.py). A change to a hand-written page, a skill or the
  # README gives the build, the benchmarks and the image nothing to check, so
  # they are skipped; the linter, which reads pages as well as Lean, always
  # runs, and the book is built whenever docs/ changed. A skipped job counts as
  # passed for branch protection, so a required check is never left waiting.
  # A push is diffed against the commit it replaced, a pull request against the
  # base it merges into; a dispatched run, or a diff git cannot compute, runs
  # everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      lean: ${{ steps.classify.outputs.lean }}
      docs: ${{ steps.classify.outputs.docs }}
      image: ${{ steps.classify.outputs.image }}
    steps:
      # Two commits deep: on a pull request, HEAD is the merge commit and HEAD^1
      # the base it merges into.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request)
              python3 scripts/ci_changes.py --base HEAD^1 --head HEAD ;;
            push)
              git fetch --depth=1 origin "$BEFORE" || true
              python3 scripts/ci_changes.py --base "$BEFORE" --head HEAD ;;
            *)
              python3 scripts/ci_changes.py --all ;;
          esac

  # Rebuilt only when its inputs change. The jobs below name the published
  # image when this one is skipped — the same tag this job outputs, and what a
  # pull request's jobs ran in already, since a pull request never pushes it.
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devcontainer-image.yml
    with:
      push: ${{ github.event_name == 'push' }}

  # Tier 4, on every change: sub-second, and it reads the hand-written pages
  # (L9, L12) as well as the Lean. L9 accepts names Foundation declares, so it
  # wants Foundation's sources, which the restored .lake holds.
  lint:
    needs: [changes, image]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.image || 'ghcr.io/testimonyproject/testimony/devcontainer:latest' }}
    steps:
      - uses: actions/checkout@v4

      # The cache `build` saves, restored only.
      - name: Restore .lake
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake
            arguments/.lake
            examples/.lake
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', '**/lake-manifest.json') }}
          restore-keys: |
            lake-packages-${{ runner.os }}-
            lake-${{ runner.os }}-

      - name: Domain linter tests
        run: |
          python3 scripts/test_testimony_lint.py
          python3 scripts/test_ci_changes.py

      - name: Domain linter
        run: python3 scripts/testimony_lint.py

  build:
    needs: [changes, image]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.lean == 'true' }}
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.image || 'ghcr.io/testimonyproject/testimony/devcontainer:latest' }}
    steps:
      - uses: actions/checkout@v4

      # Mathlib arrives transitively via Foundation; without the cache this
      # step would compile it from source. The packages built on the library
      # keep their own build output beside them, and are cached with it.
      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            .lake
            arguments/.lake
            examples/.lake
          # Keyed apart from the cache of the library alone, which held only
          # .lake: an exact hit restores and never saves, so the old key would
          # never store the packages' output.
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', '**/lake-manifest.json') }}
          restore-keys: |
            lake-packages-${{ runner.os }}-
            lake-${{ runner.os }}-

      - name: Fetch Mathlib oleans
        run: lake exe cache get

      # Tier 1: type checking, plus linter.missingDocs. The library alone: its
      # machinery and its checks over its own fixture, then the tools a
      # package's generators are built from.
      - name: Build
        run: lake build && lake build TestimonyTools

      # Tier 2: Batteries environment linters.
      - name: Environment linters
        run: lake lint

      # Tier 3: the trust base. Catches sorry, native_decide, and any
      # undeclared axiom reaching in through imports — including a `decide`
      # proof that failed silently and still produced a successful build.
      - name: Axiom audit
        run: lake exe axiom-audit

      # Tier 3, continued: replay every declaration of every Testimony module
      # through the kernel, into the environment as it stood before that
      # module, independently of the elaborator and of every tactic. A tactic
      # cannot make the kernel accept a false theorem; this checks that nothing
      # reached the environment without the kernel's say-so. The script first
      # removes build output of deleted modules: .lake/ is restored from a
      # cache, and leanchecker replays whatever .olean it finds.
      - name: Kernel replay
        run: scripts/kernel-replay.sh

      # The arguments: a package built on the library, held to the same gates.
      # It requires the library by path and shares its .lake/packages, so it
      # reuses everything built above and compiles only its own modules. Its
      # generators write the documentation's generated files, at the root.
      - name: Arguments package
        working-directory: arguments
        run: |
          lake build
          lake lint
          lake exe axiom-audit
          ../scripts/kernel-replay.sh TestimonyArguments bibgen argtex statusgen argdoc

      - name: Generated files are current
        working-directory: arguments
        run: |
          lake exe bibgen --check
          lake exe argtex --check
          lake exe statusgen --check
          lake exe argdoc --check

      # The examples: a package built on the library, held to the library's
      # gates. It requires the library by path and shares its .lake/packages, so
      # it reuses everything built above and compiles only its own modules. The
      # domain linter already read it, with the library.
      - name: Examples package
        working-directory: examples
        run: |
          lake build
          lake lint
          lake exe axiom-audit
          ../scripts/kernel-replay.sh TestimonyExamples exampletex
          lake exe exampletex --check

  # Engine benchmarks, an ablation A/B: the engine with this change and without
  # it (HEAD^1, the base it merges into), built side by side on one runner and
  # run interleaved, five rounds, so that both sides meet the same machine. Each
  # benchmark is compared by the Mann-Whitney U test. A slowdown that is
  # significant (p < 0.05) and larger than the variance bound is measured again,
  # in a few more rounds of that benchmark alone, and a shard fails only if it
  # holds with both readings pooled (p < 0.01); or it fails on a rise in peak
  # memory. Either way, not if the change accepts it with a reason in
  # arguments/bench/accepted.toml (.claude/skills/optimising-the-engine).
  #
  # The benchmarks are split into shards, each a job on a runner of its own,
  # beside `build` rather than after it: of N shards, shard K takes every N-th
  # benchmark from the K-th, by position in arguments/bench/Engine.lean. Each
  # shard is a whole A/B, and each runs the calibration benchmark, which no
  # change can move, so that each runner is checked for drift. The number of
  # shards is the length of `shard`'s list; nothing else names it.
  #
  # Only when the change touches a build input: a change no build reads cannot
  # move the engine.
  bench:
    needs: [changes, image]
    if: >-
      ${{ !cancelled() && !failure() && github.event_name == 'pull_request'
      && needs.changes.outputs.lean == 'true' }}
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.image || 'ghcr.io/testimonyproject/testimony/devcontainer:latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: bench (${{ matrix.shard }} of ${{ strategy.job-total }})
    steps:
      # Two commits deep: on a pull request, HEAD is the merge commit and HEAD^1
      # the base it merges into, which the benchmarks measure it against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The cache `build` saves, restored only: the shards would race to save
      # the same key.
      - name: Restore .lake
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake
            arguments/.lake
            examples/.lake
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', '**/lake-manifest.json') }}
          restore-keys: |
            lake-packages-${{ runner.os }}-
            lake-${{ runner.os }}-

      - name: Fetch Mathlib oleans
        run: lake exe cache get

      # The modules the benchmarks import, and nothing else: the gates over
      # them are `build`'s.
      - name: Build
        run: lake build && (cd arguments && lake build TestimonyArguments)

      - name: Engine benchmarks
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            # Until the devcontainer image with uv is published from main.
            curl -fsSL https://github.com/astral-sh/uv/releases/download/0.11.32/uv-x86_64-unknown-linux-gnu.tar.gz \
              | tar -xz --strip-components=1 -C /usr/local/bin
          fi
          git config --global --add safe.directory "$PWD"
          scripts/test_bench_compare.py
          scripts/bench-ab.sh HEAD^1 --runs 5 --shard "${{ matrix.shard }}/${{ strategy.job-total }}" \
            --out bench-results --gate

      - name: Upload benchmark samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ matrix.shard }}
          path: |
            bench-results/base.json
            bench-results/head.json
            bench-results/*-pooled.json
            bench-results/*.log
          if-no-files-found: ignore

  # One check for the shards together, whatever their number, for branch
  # protection to require: it passes when every shard passed, or when the
  # change touched nothing the benchmarks measure and they were skipped.
  benchmarks:
    needs: [changes, bench]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          CHANGES: ${{ needs.changes.result }}
          LEAN: ${{ needs.changes.outputs.lean }}
          BENCH: ${{ needs.bench.result }}
        run: |
          test "$CHANGES" = success
          test "$BENCH" = success || { test "$LEAN" = false && test "$BENCH" = skipped; }

  docs:
    needs: [changes, image]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.image || 'ghcr.io/testimonyproject/testimony/devcontainer:latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build book
        run: mdbook build docs
