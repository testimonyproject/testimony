name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/testimonyproject/testimony/devcontainer:latest
    steps:
      - uses: actions/checkout@v4

      # Mathlib arrives transitively via Foundation; without the cache this
      # step would compile it from source.
      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          restore-keys: lake-${{ runner.os }}-

      - name: Fetch Mathlib oleans
        run: lake exe cache get

      # Tier 1: type checking, plus linter.missingDocs.
      - name: Build
        run: lake build

      # Tier 4 first among the checks: sub-second, so it fails fast.
      - name: Domain linter tests
        run: python3 scripts/test_testimony_lint.py

      - name: Domain linter
        run: python3 scripts/testimony_lint.py

      # Tier 2: Batteries environment linters.
      - name: Environment linters
        run: lake lint

      # Tier 3: the trust base. Catches sorry, native_decide, and any
      # undeclared axiom reaching in through imports — including a `decide`
      # proof that failed silently and still produced a successful build.
      - name: Axiom audit
        run: lake exe axiom-audit

      - name: Generated files are current
        run: |
          lake exe bibgen --check
          lake exe argtex --check

  docs:
    runs-on: ubuntu-latest
    container: ghcr.io/testimonyproject/testimony/devcontainer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build book
        run: mdbook build docs
