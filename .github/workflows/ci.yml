name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devcontainer-image.yml
    with:
      push: ${{ github.event_name == 'push' }}

  build:
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # Mathlib arrives transitively via Foundation; without the cache this
      # step would compile it from source. The packages built on the library
      # keep their own build output beside them, and are cached with it.
      - name: Cache .lake
        uses: actions/cache@v4
        with:
          path: |
            .lake
            arguments/.lake
            examples/.lake
          # Keyed apart from the cache of the library alone, which held only
          # .lake: an exact hit restores and never saves, so the old key would
          # never store the packages' output.
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', '**/lake-manifest.json') }}
          restore-keys: |
            lake-packages-${{ runner.os }}-
            lake-${{ runner.os }}-

      - name: Fetch Mathlib oleans
        run: lake exe cache get

      # Tier 1: type checking, plus linter.missingDocs. The library alone: its
      # machinery and its checks over its own fixture, then the tools a
      # package's generators are built from.
      - name: Build
        run: lake build && lake build TestimonyTools

      # Tier 4 first among the checks: sub-second, so it fails fast.
      - name: Domain linter tests
        run: python3 scripts/test_testimony_lint.py

      - name: Domain linter
        run: python3 scripts/testimony_lint.py

      # Tier 2: Batteries environment linters.
      - name: Environment linters
        run: lake lint

      # Tier 3: the trust base. Catches sorry, native_decide, and any
      # undeclared axiom reaching in through imports — including a `decide`
      # proof that failed silently and still produced a successful build.
      - name: Axiom audit
        run: lake exe axiom-audit

      # Tier 3, continued: replay every declaration of every Testimony module
      # through the kernel, into the environment as it stood before that
      # module, independently of the elaborator and of every tactic. A tactic
      # cannot make the kernel accept a false theorem; this checks that nothing
      # reached the environment without the kernel's say-so. The script first
      # removes build output of deleted modules: .lake/ is restored from a
      # cache, and leanchecker replays whatever .olean it finds.
      - name: Kernel replay
        run: scripts/kernel-replay.sh

      # The arguments: a package built on the library, held to the same gates.
      # It requires the library by path and shares its .lake/packages, so it
      # reuses everything built above and compiles only its own modules. Its
      # generators write the documentation's generated files, at the root.
      - name: Arguments package
        working-directory: arguments
        run: |
          lake build
          lake lint
          lake exe axiom-audit
          ../scripts/kernel-replay.sh TestimonyArguments bibgen argtex statusgen argdoc

      - name: Generated files are current
        working-directory: arguments
        run: |
          lake exe bibgen --check
          lake exe argtex --check
          lake exe statusgen --check
          lake exe argdoc --check

      # Engine benchmarks: does this change make the engine slower? Every
      # benchmark runs five times, enough for p < 0.05 when every sample moves; each run is compared with the baseline
      # recorded in arguments/bench/baseline.json by the Mann-Whitney U test.
      # The step fails on a slowdown that is significant (p < 0.05) and larger
      # than the variance bound (--threshold), below which runner noise could
      # account for it, and on a rise in a benchmark's peak memory. Times are
      # normalized by the calibration benchmark, so a slower runner is not taken
      # for a slower engine. A regression a change accepts on purpose, with its
      # reason, is listed in arguments/bench/accepted.toml. Every run's samples
      # are uploaded, and a run on main is what a new baseline is taken from
      # (.claude/skills/optimising-the-engine).
      - name: Engine benchmarks
        run: |
          if ! command -v uv >/dev/null 2>&1; then
            # Until the devcontainer image with uv is published from main.
            curl -fsSL https://github.com/astral-sh/uv/releases/download/0.11.32/uv-x86_64-unknown-linux-gnu.tar.gz \
              | tar -xz --strip-components=1 -C /usr/local/bin
          fi
          scripts/bench.sh --runs 5 --out bench-results.json
          if [ -f arguments/bench/baseline.json ]; then
            scripts/bench-compare.py arguments/bench/baseline.json bench-results.json \
              --normalize "calibration: kernel list reduction" --threshold 0.10 \
              --accept arguments/bench/accepted.toml --gate
          else
            echo "::warning::no arguments/bench/baseline.json; record one from this run's bench-results artifact"
          fi

      - name: Upload benchmark samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: ignore

      # The examples: a package built on the library, held to the library's
      # gates. It requires the library by path and shares its .lake/packages, so
      # it reuses everything built above and compiles only its own modules. The
      # domain linter already read it, with the library.
      - name: Examples package
        working-directory: examples
        run: |
          lake build
          lake lint
          lake exe axiom-audit
          ../scripts/kernel-replay.sh TestimonyExamples exampletex
          lake exe exampletex --check

  docs:
    needs: image
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build book
        run: mdbook build docs
