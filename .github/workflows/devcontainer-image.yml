name: Devcontainer image

# Builds the image that .devcontainer/devcontainer.json, ci.yml and docs.yml
# all run in, so "reproducible locally" and "reproducible in CI" stay the
# same claim.
#
# ci.yml and docs.yml call this as a reusable workflow (`uses:` + `needs:`)
# rather than relying on it having finished from a separate, same-push
# trigger — the two used to race, and whichever pulled the image first lost
# when a Dockerfile change and other commits landed in the same push.
# docker/build-push-action's GHA cache makes an unchanged rebuild cheap, so
# calling it on every run costs little.
#
# `push` is false for pull_request runs: a fork PR's GITHUB_TOKEN can't write
# packages, and a same-repo PR shouldn't mutate the shared `:latest` tag
# before merging anyway. Skipping the push still validates the Dockerfile
# builds; downstream jobs fall back to the last published image.
on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the built image to GHCR (false just validates the build)
        type: boolean
        default: true
  workflow_call:
    inputs:
      push:
        description: Push the built image to GHCR (false just validates the build)
        type: boolean
        default: true
    outputs:
      image:
        description: Fully qualified, always-current devcontainer image ref
        value: ${{ jobs.build-and-push.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ghcr.io/testimonyproject/testimony/devcontainer:latest
    steps:
      - uses: actions/checkout@v4

      - if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: ${{ inputs.push }}
          tags: ghcr.io/testimonyproject/testimony/devcontainer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
