name: Devcontainer image

# Builds the image that .devcontainer/devcontainer.json, ci.yml and docs.yml
# all run in, so "reproducible locally" and "reproducible in CI" stay the
# same claim. Runs on the pin changing, not on every push.
on:
  push:
    branches: [main]
    paths:
      - .devcontainer/**
      - lean-toolchain
      - .github/workflows/devcontainer-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ghcr.io/testimonyproject/testimony/devcontainer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
