name: PDF

# Typesets the print editions: the arguments together (docs/latex/arguments.tex),
# each argument on its own (docs/latex/arguments/<slug>.tex), and the examples
# package's documents (examples/docs/latex/*.tex), and uploads the PDFs as the
# `pdfs` artifact: arguments.pdf, arguments/<slug>.pdf and the examples'.
#
# Each argument's document names the people behind it. That credit is worked
# out here, from git history, by scripts/credits.py, and is not in the
# committed .tex: a commit that names no person is credited to whoever merged
# it, so the credit changes when a pull request merges. On a pull request the
# checkout is GitHub's trial merge, whose author GitHub sets to the pull
# request's, so its PDFs already credit the pull request's own commits to its
# author, as the real merge will if the author merges it.
#
# Each document also gives its date and version under its title, and ends with
# how to make it again from its commit. scripts/edition.py works those out here,
# for the same reason: the commit being typeset is not known when the .tex is
# generated. On a pull request it is GitHub's trial merge, and the document
# says it is a preview of that pull request.
#
# On a pull request this is the check that the print edition still typesets, so
# a LaTeX error is caught before it reaches main. docs.yml calls it to put the
# PDFs beside the site, and release.yml to attach them to a tagged release.
#
# The arguments' and the examples' .tex files, and references.bib, are generated
# from the Lean source here (scripts/generate-docs.sh), not committed, so this job
# builds the arguments and the examples. The arguments' bibliography is the
# generated references.bib, copied beside each document; the examples' is
# written beside theirs by `lake exe exampletex`.
#
# On a pull request it runs only when the change touches a build input, as
# ci.yml's build does (scripts/ci_changes.py), and the image is rebuilt only
# when its own inputs change. Called by docs.yml or release.yml it always runs:
# they need the PDFs whatever changed.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      lean: ${{ steps.classify.outputs.lean }}
      image: ${{ steps.classify.outputs.image }}
    steps:
      # HEAD is the merge commit, HEAD^1 the base it merges into.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: classify
        run: python3 scripts/ci_changes.py --base HEAD^1 --head HEAD

  image:
    needs: changes
    if: >-
      ${{ !cancelled() && !failure()
      && (github.event_name != 'pull_request' || needs.changes.outputs.image == 'true') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/devcontainer-image.yml
    with:
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  typeset:
    needs: [changes, image]
    if: >-
      ${{ !cancelled() && !failure()
      && (github.event_name != 'pull_request' || needs.changes.outputs.lean == 'true') }}
    runs-on: ubuntu-latest
    container: ${{ needs.image.outputs.image || 'ghcr.io/testimonyproject/testimony/devcontainer:latest' }}
    # The container is a GHCR package: a job that names its permissions must
    # ask to read it, as docs.yml explains.
    permissions:
      contents: read
      packages: read
    steps:
      # The whole history: each document credits the people behind its
      # arguments, from every commit to them (scripts/credits.py), and refuses a
      # shallow clone rather than drop the older work's credit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The cache ci.yml saves. Restored only: this job builds nothing of its
      # own worth keeping.
      - name: Restore .lake
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake
            arguments/.lake
            examples/.lake
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', '**/lake-manifest.json') }}
          restore-keys: |
            lake-packages-${{ runner.os }}-
            lake-${{ runner.os }}-

      - name: Fetch Mathlib oleans
        run: lake exe cache get

      # The documents are generated from the Lean source, not committed.
      - name: Generate documentation
        run: scripts/generate-docs.sh

      # The checkout belongs to the runner, not to the container's user, and
      # git refuses to read a repository someone else owns until told it is
      # safe.
      - name: Arguments
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 scripts/credits.py docs/latex docs/latex/arguments
          python3 scripts/edition.py docs/latex docs/latex/arguments
          cp references.bib docs/latex/
          cp references.bib docs/latex/arguments/
          scripts/typeset.sh docs/latex/arguments.tex docs/latex/arguments/*.tex

      # `exampletex`, in the generation step, wrote the documents and the
      # bibliography beside them.
      - name: Examples
        working-directory: examples
        run: |
          python3 ../scripts/edition.py docs/latex
          ../scripts/typeset.sh docs/latex/*.tex

      - name: Collect
        run: |
          mkdir -p pdf/arguments
          cp docs/latex/arguments.pdf pdf/
          cp docs/latex/arguments/*.pdf pdf/arguments/
          cp examples/docs/latex/*.pdf pdf/

      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: pdf/
          if-no-files-found: error

      # The site's generated pages, for the deploy in docs.yml to build the book
      # from.
      - uses: actions/upload-artifact@v4
        with:
          name: generated
          path: |
            references.bib
            docs/src/bibliography.md
            docs/src/arguments/
            docs/src/SUMMARY.md
            docs/src/roadmap.md
            docs/src/maturity.md
          if-no-files-found: error
